<title>Khooni Shatranj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Tiro+Devanagari+Hindi&display=swap">
<style>
:root{--bg:#0b0806;--ink:#f3e6cc;--dim:#b49f80;--gold:#d9a441;--gold2:#f2cf7a;--blood:#a3161a;--line:#f2cf7a33;--panel:#120c08e6;--panel2:#1a120cf2;--white:#f4f1e8;--blue:#4da3ff;--red:#ff2d3a;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Cormorant Garamond",Georgia,serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.cz{font-family:Cinzel,"Trajan Pro",Georgia,serif;letter-spacing:.12em;text-transform:uppercase}
button{font:inherit;color:inherit}
.btn{pointer-events:auto;min-height:48px;padding:0 20px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:Cinzel,serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:#f2cf7a99}
.btn.main{border-color:var(--gold2);background:linear-gradient(#a3161a,#5e0b0e);font-weight:700;font-size:17px;padding:0 34px;min-height:58px;box-shadow:0 0 30px #a3161a66}
.icon{pointer-events:auto;width:48px;height:48px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--gold2)}
.icon svg{width:22px;height:22px}
.seg{pointer-events:auto;display:inline-flex;border:1px solid var(--line);background:var(--panel)}
.seg button{min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--dim);font-family:Cinzel,serif;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.seg button.on{color:var(--ink);background:#d9a44126;box-shadow:inset 0 -2px 0 var(--gold2)}
body[data-army=ecl] .seg button.on{box-shadow:inset 0 -2px 0 #b9a6c9}
.screen{position:fixed;inset:0;pointer-events:none;padding:calc(14px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
.dim{background:#0b0806c4;pointer-events:auto;display:flex;align-items:center;justify-content:center}
/* title */
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,#0b0806aa 0%,transparent 30%,transparent 60%,#0b0806dd 100%);pointer-events:auto;cursor:pointer}
#title h1{margin:0;font-size:clamp(34px,8vw,84px);font-weight:900;color:var(--gold2);line-height:1;text-shadow:0 4px 30px #000,0 0 50px #d9a44144}
#title .dev{font-family:"Tiro Devanagari Hindi",serif;font-size:clamp(24px,5vw,50px);color:var(--gold);margin-top:6px;text-shadow:0 3px 18px #000}
#title .rule{width:min(360px,60vw);height:2px;background:linear-gradient(90deg,transparent,var(--blood),transparent);margin:14px auto}
#title .tag{font-style:italic;color:var(--ink);font-size:clamp(16px,2.4vw,22px);text-shadow:0 2px 10px #000}
#title .tap{margin-top:7vh;font-size:13px;color:var(--gold2);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
/* home */
#home .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
#home .top .grp{display:flex;gap:8px;flex-wrap:wrap}
#home .logo{font-size:15px;color:var(--gold2);font-weight:700;align-self:center;text-shadow:0 2px 8px #000}
#pinfo{position:absolute;left:calc(16px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-42%);width:min(300px,38vw);pointer-events:auto;background:linear-gradient(90deg,#0b0806d9,#0b080600);padding:14px 14px 14px 0}
#pinfo .role{font-size:11px;color:var(--gold);letter-spacing:.24em}
#pinfo h2{margin:2px 0 10px;font-size:clamp(18px,2.6vw,26px);color:var(--ink);line-height:1.1}
.stat{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:8px;font-family:Cinzel,serif;font-size:10px;letter-spacing:.14em;color:var(--dim);margin:5px 0}
.stat i{display:block;height:5px;background:#000a;border:1px solid var(--line);position:relative}
.stat i b{position:absolute;inset:0;background:linear-gradient(90deg,#8a6420,#f2cf7a);transform-origin:left}
#pinfo .tech{margin-top:10px;font-size:15px;color:var(--ink)}
#pinfo .tech em{color:var(--gold2);font-style:normal}
#pinfo p{margin:6px 0 0;font-size:14.5px;color:var(--dim);line-height:1.3}
.arrow{position:absolute;top:50%;transform:translateY(-50%);pointer-events:auto}
#prevP{left:calc(min(300px,38vw) + 30px)}#nextP{right:calc(16px + env(safe-area-inset-right,0px))}
#home .bottom{position:absolute;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center}
#dots{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px}
#dots b{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--gold);display:block}#dots b.on{background:var(--gold2)}
/* sheets */
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);max-height:88%;overflow:auto;background:var(--panel2);border:1px solid var(--line);border-bottom:0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:auto;z-index:20;box-shadow:0 -10px 40px #000a;box-sizing:border-box}
.sheet header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet h3{margin:0;font-size:16px;color:var(--gold2)}
.sheet h4{margin:14px 0 4px;font-size:11px;color:var(--gold);letter-spacing:.22em}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:46px;border-bottom:1px solid #f2cf7a14}
.row label{font-size:16px}
.row small{display:block;color:var(--dim);font-size:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:min(260px,44vw);height:4px;background:#f2cf7a33;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:var(--gold2);transform:rotate(45deg);border:0;cursor:pointer}
input[type=range]::-moz-range-thumb{width:20px;height:20px;background:var(--gold2);border:0;border-radius:0}
.tog{pointer-events:auto;width:52px;height:28px;border:1px solid var(--line);background:#000a;position:relative;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:18px;height:18px;background:var(--dim);transition:left .15s,background .15s}
.tog.on{background:#d9a44133}.tog.on::after{left:28px;background:var(--gold2)}
/* look swatches */
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;margin:6px 0 4px}
.sw button{pointer-events:auto;height:64px;border:1px solid var(--line);cursor:pointer;position:relative;color:#fff;font-family:Cinzel,serif;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:flex-end;justify-content:center;padding:0 2px 5px;text-shadow:0 1px 3px #000}
.sw button.on{outline:2px solid var(--gold2);outline-offset:1px}
.sw [data-s=real]{background:linear-gradient(160deg,#3a2414,#b07a44 55%,#e8c890)}
.sw [data-s=painted]{background:radial-gradient(circle at 30% 30%,#e7c79b,#c48a5a 45%,#7a3a2a 80%),#e7d6b5}
.sw [data-s=comic]{background:linear-gradient(135deg,#f2c14e 0 40%,#c0392b 40% 70%,#1d1d1d 70%);box-shadow:inset 0 0 0 3px #111}
.sw [data-s=toy]{background:repeating-conic-gradient(#d8bf94 0 25%,#7a5a3a 0 50%) 0 0/20px 20px;filter:blur(.4px) saturate(1.3)}
.sw [data-s=night]{background:radial-gradient(circle at 70% 25%,#f8d27a 0 6%,transparent 7%),linear-gradient(#070b1c,#232a40 70%,#120f12)}
.sw [data-s=shadow]{background:linear-gradient(#fffaf0,#d8d1c4);color:#111;text-shadow:none}
.sw [data-s=shadow]::before{content:"";position:absolute;left:30%;bottom:18px;width:12px;height:26px;background:#111;border-radius:6px 6px 0 0;box-shadow:24px 4px 0 -2px #111}
.sw [data-s=retro]{background:conic-gradient(#b07a44 0 25%,#3a2414 0 50%,#e8c890 0 75%,#7a5a3a 0) 0 0/16px 16px}
.qread{font-family:Cinzel,serif;font-size:10px;letter-spacing:.12em;color:var(--dim);margin-top:4px;text-align:right}
#lookBtn{pointer-events:auto;min-height:48px;padding:0 12px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-family:Cinzel,serif;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
/* how to play */
.card{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;min-height:150px}
.card svg{width:120px;height:120px}
.card h5{margin:0 0 6px;font-family:Cinzel,serif;font-size:15px;letter-spacing:.1em;color:var(--gold2);text-transform:uppercase}
.card p{margin:0;font-size:16px;line-height:1.35}
.card kbd{font-family:Cinzel,serif;font-size:11px;border:1px solid var(--line);padding:1px 6px;color:var(--ink)}
.hnav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
#hdots{display:flex;gap:7px}#hdots b{width:7px;height:7px;transform:rotate(45deg);border:1px solid var(--gold);display:block}#hdots b.on{background:var(--gold2)}
/* pause + result */
.menuBox{display:flex;flex-direction:column;gap:10px;align-items:stretch;min-width:min(320px,80vw);text-align:center}
.menuBox h2{margin:0 0 10px;font-size:clamp(28px,6vw,48px);color:var(--gold2)}
#end h2{font-size:clamp(40px,10vw,96px);margin:0;color:var(--gold2);text-shadow:0 0 40px #a3161a88}
#end h2.lose{color:#e8dcc0}
#end .why{color:var(--ink);font-size:clamp(16px,2.4vw,22px);margin:4px 0 14px}
#estats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0 auto 16px;max-width:620px}
#estats div{border:1px solid var(--line);background:var(--panel);padding:8px 4px}
#estats b{display:block;font-family:Cinzel,serif;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
#estats span{font-family:Cinzel,serif;font-size:9.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* battle HUD */
#hud{position:fixed;inset:0;pointer-events:none}
#vit{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));width:min(240px,42vw)}
#vit .nm{font-size:10.5px;color:var(--gold2);margin-bottom:5px;text-shadow:0 1px 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:9px;background:#000b;border:1px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,#7d0e12,#d2302c)}
.bar.g{height:4px;margin-top:4px}.bar.g i{background:linear-gradient(90deg,#8a6420,#f2cf7a)}
#res{display:flex;gap:8px;margin-top:8px}
#res b{width:11px;height:11px;transform:rotate(45deg);border:1px solid var(--gold);background:transparent;transition:background .2s}
#res b.on{background:var(--gold2);box-shadow:0 0 10px var(--gold)}
#round{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font-size:12px;color:var(--dim);white-space:nowrap;text-shadow:0 2px 8px #000}
#round b{color:var(--ink);font-size:17px;font-weight:700;margin:0 2px}
#pauseBtn{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px))}
#combo{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));top:calc(72px + env(safe-area-inset-top,0px));text-align:right;opacity:0;transition:opacity .3s;text-shadow:0 2px 10px #000}
#combo b{display:block;font-size:38px;line-height:1;color:var(--ink);font-weight:900}
#combo span{font-size:10px;letter-spacing:.24em;color:var(--dim)}
#combo em{display:none;font-style:normal;font-size:10px;letter-spacing:.12em;color:#ff9a6a;margin-top:4px}
#combo.warm b{color:var(--gold2)}#combo.hot b{color:#ff9a6a}#combo.hot em{display:block}
#ind{position:absolute;inset:0}
.ia{position:absolute;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:22px solid #fff;filter:drop-shadow(0 0 6px currentColor);transform-origin:50% 60%}
#tags{position:absolute;inset:0;overflow:hidden}
.tg{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:12px;color:var(--ink);text-shadow:0 1px 4px #000;white-space:nowrap}
.tg .bar{width:70px;height:4px;margin:3px auto 0}
.ft{position:absolute;transform:translate(-50%,-50%);font-family:Cinzel,serif;font-weight:700;letter-spacing:.1em;font-size:17px;white-space:nowrap;text-shadow:0 2px 10px #000;animation:fl 1.1s ease-out forwards;pointer-events:none}
@keyframes fl{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}100%{opacity:0;transform:translate(-50%,-160%)}}
#toast{position:absolute;top:28%;left:0;right:0;text-align:center;font-size:clamp(26px,6vw,54px);color:var(--ink);text-shadow:0 4px 24px #000;opacity:0;transition:opacity .5s}
#toast.on{opacity:1}
#toast small{display:block;font-family:"Cormorant Garamond",serif;text-transform:none;letter-spacing:.02em;font-size:clamp(16px,2.4vw,22px);color:var(--dim);font-style:italic}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 55%,#6a0306cc 100%);transition:opacity .15s}
#letter{position:fixed;left:0;right:0;height:0;background:#000;transition:height .4s;pointer-events:none;z-index:2}
#letter.t{top:0}
/* touch */
#touch{position:fixed;inset:0;pointer-events:none}
#joy{position:absolute;left:calc(24px + env(safe-area-inset-left,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid #f2cf7a55;background:#0006;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:38px;top:38px;width:44px;height:44px;border-radius:50%;background:#f2cf7a55}
.tb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:1px solid var(--gold2);background:#120c08cc;color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:11px;letter-spacing:.1em}
.tb:active,.tb.dn{background:#d9a44155}
#tA{right:calc(24px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:96px;height:96px;border-color:#ff7a5a}
#tB{right:calc(132px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:74px;height:74px}
#touch.ready .tb{box-shadow:0 0 18px #f2cf7aaa,inset 0 0 12px #f2cf7a55;animation:pulse 1.2s ease-in-out infinite}
#rotate{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;text-align:center;color:var(--gold2);font-size:16px;padding:16px}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
@media (max-width:640px){#pinfo p{display:none}#estats{grid-template-columns:repeat(3,1fr)}.card{grid-template-columns:80px 1fr}.card svg{width:80px;height:80px}}
</style>

<canvas id="c" tabindex="0"></canvas>
<div id="letter" class="t"></div><div id="letter2" style="position:fixed;left:0;right:0;bottom:0;height:0;background:#000;transition:height .4s;pointer-events:none;z-index:2"></div>
<div id="hurt"></div>
<div id="hud" hidden>
  <div id="vit"><div class="nm cz" id="pname"></div><div class="bar"><i id="hpb"></i></div><div class="bar g"><i id="gdb"></i></div><div id="res"><b></b><b></b><b></b></div></div>
  <div id="round" class="cz"></div>
  <button id="pauseBtn" class="icon" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
  <div id="combo" class="cz"><b id="cbn">0</b><span>combo</span><em>Takedown: hold strike</em></div>
  <div id="tags"></div>
  <div id="ind"></div>
  <div id="toast" class="cz"></div>
</div>
<div id="touch" hidden><div id="joy"><div id="knob"></div></div><div class="tb" id="tA">Strike</div><div class="tb" id="tB">Block</div></div>

<section id="title" class="screen">
  <h1 class="cz">Khooni Shatranj</h1>
  <div class="dev" lang="hi">खूनी शतरंज</div>
  <div class="rule"></div>
  <div class="tag">Sixteen against sixteen. One king falls.</div>
  <div class="tap cz">Tap to begin</div>
</section>

<section id="home" class="screen" hidden>
  <div class="top">
    <div class="grp">
      <div class="seg" id="bmode"><button data-m="battle">Battle 16 v 16</button><button data-m="gauntlet">Gauntlet</button></div>
      <div class="seg" id="army"><button data-a="sun">Sun</button><button data-a="ecl">Eclipse</button></div>
    </div>
    <div class="grp">
      <button id="lookBtn">Realistic</button>
      <button class="icon" id="fsBtn" aria-label="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <button class="icon" id="helpBtn" aria-label="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 9a3 3 0 1 1 4 2.8c-.8.3-1 1-1 1.7V15"/><circle cx="12" cy="18.5" r=".6" fill="currentColor"/></svg></button>
      <button class="icon" id="gearBtn" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg></button>
    </div>
  </div>
  <div id="pinfo">
    <div class="role cz" id="prole"></div>
    <h2 class="cz" id="ptitle"></h2>
    <div class="stat">Vitality<i><b id="sv"></b></i></div>
    <div class="stat">Posture<i><b id="sp"></b></i></div>
    <div class="stat">Speed<i><b id="ss"></b></i></div>
    <div class="stat">Reach<i><b id="sr"></b></i></div>
    <div class="tech" id="ptech"></div>
    <p id="pdesc"></p>
  </div>
  <button class="icon arrow" id="prevP" aria-label="Previous piece"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="icon arrow" id="nextP" aria-label="Next piece"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5l7 7-7 7"/></svg></button>
  <div id="dots"></div>
  <div class="bottom"><button class="btn main" id="go">Battle</button></div>
</section>

<section id="settings" class="sheet" hidden>
  <header><h3 class="cz">Settings</h3><button class="icon" id="setClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
  <h4 class="cz">Look</h4>
  <div class="sw" id="sStyle"><button data-s="real">Realistic</button><button data-s="painted">Painted</button><button data-s="comic">Comic</button><button data-s="toy">Toy board</button><button data-s="night">Night battle</button><button data-s="shadow">Shadow war</button><button data-s="retro">Retro pixel</button></div>
  <div class="row"><label id="sStyleLbl">Contrast</label><input type="range" id="sStyleP" min="0" max="100"></div>
  <div class="row"><label>Time of day</label><div class="seg" id="sTime"><button data-v="dawn">Dawn</button><button data-v="day">Day</button><button data-v="dusk">Dusk</button><button data-v="night">Night</button></div></div>
  <div class="row"><label>Weather</label><div class="seg" id="sWeather"><button data-v="clear">Clear</button><button data-v="rain">Rain</button><button data-v="snow">Snow</button><button data-v="storm">Storm</button><button data-v="random">Random</button></div></div>
  <h4 class="cz">Gameplay</h4>
  <div class="row"><label>Camera zoom<small>Close duel to commander view · pinch or wheel in battle</small></label><input type="range" id="sZoom" min="0" max="100"></div>
  <div class="row"><label>Camera sensitivity</label><input type="range" id="sSens" min="30" max="200"></div>
  <div class="row"><label>Assist<small>Auto-counter and a wider parry</small></label><button class="tog" id="sAssist" aria-label="Assist"></button></div>
  <div class="row"><label>Hints</label><button class="tog" id="sHints" aria-label="Hints"></button></div>
  <div class="row"><label>Screen shake</label><button class="tog" id="sShake" aria-label="Screen shake"></button></div>
  <h4 class="cz">Audio</h4>

(function(){var st=BABYLON.MeshBuilder.CreateCylinder('stake',{diameterTop:0,diameterBottom:.16,height:1.35,tessellation:6},scene);st.material=MAT.wood;

/* army banners and camps: textures per army, applied to the near or far side */
